trigger:
  - main

variables:
  azureSubscriptionConnection: 'AzureSubscriptionServiceConnection'
  acrRegistryName: 'hmforecastacr.azurecr.io'
  imageRepository: 'hm-retail-forecast-ui'
  webAppName: 'hm-demand-control-plane'

stages:
- stage: QualityGate
  jobs:
  - job: ValidateModel
    pool: { vmImage: 'ubuntu-latest' }
    steps:
    - task: UsePythonVersion@0
      inputs: { versionSpec: '3.11' }
    - script: |
        pip install -r requirements.txt
        python src/run_promo_forecast.py
        python -c "import json; assert json.load(open('artifacts/evaluation_metrics.json'))['test']['WMAPE'] < 20.0"
      displayName: 'Train & Validate Accuracy Gate'

- stage: BuildAndPush
  dependsOn: QualityGate
  jobs:
  - job: DockerBuild
    pool: { vmImage: 'ubuntu-latest' }
    steps:
    - task: Docker@2
      inputs:
        command: buildAndPush
        containerRegistry: '$(azureSubscriptionConnection)'
        repository: '$(imageRepository)'
        dockerfile: 'Dockerfile'
        tags: '$(Build.BuildId)\nlatest'










